<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 690" width="1400" height="690" role="img" aria-label="Figura 2. Distribución de avisos por reglas: cada aviso se publica una vez y llega solo a los destinos cuya regla coincide"><title>Figura 2. Distribución de avisos por reglas: cada aviso se publica una vez y llega solo a los destinos cuya regla coincide</title><defs><marker id="m-peticion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="i-peticion" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="m-identidad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B5FBF"/></marker><marker id="i-identidad" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B5FBF"/></marker><marker id="m-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9822B"/></marker><marker id="i-async" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9822B"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker><marker id="i-ok" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker><marker id="m-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="i-no" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="m-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FB0"/></marker><marker id="i-azul" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FB0"/></marker><marker id="m-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker><marker id="i-verde" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker><marker id="m-manual" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="i-manual" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><style>text{font-family:Segoe UI, Arial, Helvetica, sans-serif;} .t{font-weight:600;fill:#1F2937;} .s{font-size:12.5px;fill:#4B5563;} .grupo{font-size:13px;font-weight:700;letter-spacing:.06em;} .e{font-size:12.5px;fill:#374151;} .eb{font-size:12.5px;fill:#374151;font-weight:600;} .lbl{font-size:12.5px;fill:#1F2937;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round;}</style></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="20" y="20" width="1360" height="70" rx="14" fill="#F7F7F8" stroke="#C7CAD1" stroke-width="1.5"/><text x="34" y="42" class="grupo" fill="#C7CAD1">EJEMPLO</text><text x="118" y="39" class="e" text-anchor="start">En MISE Centro el proveedor rechaza una boleta y una comanda tomada durante una caída queda en conflicto. Cada aviso</text><text x="118" y="57" class="e" text-anchor="start">se publica una sola vez; SNS entrega una copia a cada destino cuya regla incluye ese aviso y ese local, y a nadie más.</text><text x="40" y="112" class="grupo" text-anchor="start" fill="#6B7280">AVISOS DEL LOCAL</text><rect x="40" y="140" width="300" height="96" rx="9" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.6"/><text x="190.0" y="177.0" class="t" font-size="15" text-anchor="middle">Boleta rechazada</text><text x="190.0" y="195.0" class="s" text-anchor="middle">origen: emisión del documento</text><text x="190.0" y="211.0" class="s" text-anchor="middle">aviso: documento rechazado · MISE Centro</text><rect x="40" y="390" width="300" height="96" rx="9" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.6"/><text x="190.0" y="427.0" class="t" font-size="15" text-anchor="middle">Comanda en conflicto</text><text x="190.0" y="445.0" class="s" text-anchor="middle">origen: reaplicación tras una caída</text><text x="190.0" y="461.0" class="s" text-anchor="middle">aviso: comanda en conflicto · MISE Centro</text><text x="420" y="112" class="grupo" text-anchor="start" fill="#6B7280">DISTRIBUCIÓN</text><rect x="420" y="230" width="290" height="150" rx="9" fill="#FFF1DC" stroke="#C2812A" stroke-width="1.6"/><text x="565.0" y="270.0" class="t" font-size="14" text-anchor="middle">Amazon SNS · tema de avisos</text><text x="565.0" y="288.0" class="s" text-anchor="middle">recibe cada aviso una vez</text><text x="565.0" y="304.0" class="s" text-anchor="middle">y compara sus atributos (aviso</text><text x="565.0" y="320.0" class="s" text-anchor="middle">y local) con la regla de cada</text><text x="565.0" y="336.0" class="s" text-anchor="middle">destino: entrega una copia</text><text x="565.0" y="352.0" class="s" text-anchor="middle">solo donde coinciden</text><text x="800" y="112" class="grupo" text-anchor="start" fill="#6B7280">DESTINOS Y SUS REGLAS</text><rect x="800" y="125" width="330" height="84" rx="9" fill="#E7F5EC" stroke="#2E8B57" stroke-width="1.6"/><text x="965.0" y="156.0" class="t" font-size="14" text-anchor="middle">Contabilidad · cola</text><text x="965.0" y="174.0" class="s" text-anchor="middle">local: MISE Centro</text><text x="965.0" y="190.0" class="s" text-anchor="middle">reglas: documento rechazado</text><rect x="800" y="235" width="330" height="84" rx="9" fill="#E7F5EC" stroke="#2E8B57" stroke-width="1.6"/><text x="965.0" y="266.0" class="t" font-size="14" text-anchor="middle">Jefe de turno · correo</text><text x="965.0" y="284.0" class="s" text-anchor="middle">local: MISE Centro</text><text x="965.0" y="300.0" class="s" text-anchor="middle">reglas: comanda en conflicto</text><rect x="800" y="345" width="330" height="84" rx="9" fill="#E7F5EC" stroke="#2E8B57" stroke-width="1.6"/><text x="965.0" y="376.0" class="t" font-size="14" text-anchor="middle">Dueño · correo</text><text x="965.0" y="394.0" class="s" text-anchor="middle">local: MISE Centro</text><text x="965.0" y="410.0" class="s" text-anchor="middle">reglas: documento rechazado, comanda en conflicto</text><rect x="800" y="455" width="330" height="84" rx="9" fill="#FBEAEA" stroke="#C0392B" stroke-width="1.6"/><text x="965.0" y="486.0" class="t" font-size="14" text-anchor="middle">Contabilidad Norte · cola</text><text x="965.0" y="504.0" class="s" text-anchor="middle">local: Sucursal Norte</text><text x="965.0" y="520.0" class="s" text-anchor="middle">reglas: documento rechazado</text><text x="1160" y="112" class="grupo" text-anchor="start" fill="#6B7280">QUÉ RECIBE</text><text x="1160" y="161" class="eb" text-anchor="start" fill="#2E8B57">✔ documento rechazado</text><text x="1160" y="183" class="eb" text-anchor="start" fill="#8A8F98">✕ comanda en conflicto: no es su regla</text><text x="1160" y="271" class="eb" text-anchor="start" fill="#8A8F98">✕ documento rechazado: no es su regla</text><text x="1160" y="293" class="eb" text-anchor="start" fill="#2F6FB0">✔ comanda en conflicto</text><text x="1160" y="381" class="eb" text-anchor="start" fill="#2E8B57">✔ documento rechazado</text><text x="1160" y="403" class="eb" text-anchor="start" fill="#2F6FB0">✔ comanda en conflicto</text><text x="1160" y="491" class="eb" text-anchor="start" fill="#8A8F98">✕ documento rechazado: otro local</text><text x="1160" y="513" class="eb" text-anchor="start" fill="#8A8F98">✕ comanda en conflicto: otro local</text><path d="M340,188 H380 V285 H420" fill="none" stroke="#2E8B57" stroke-width="1.8" marker-end="url(#m-verde)"/><path d="M340,438 H380 V325 H420" fill="none" stroke="#2F6FB0" stroke-width="1.8" marker-end="url(#m-azul)"/><path d="M710,285 H740 V167 H800" fill="none" stroke="#2E8B57" stroke-width="1.8" marker-end="url(#m-verde)"/><path d="M740,285 V377 H800" fill="none" stroke="#2E8B57" stroke-width="1.8" marker-end="url(#m-verde)"/><path d="M710,325 H765 V277 H800" fill="none" stroke="#2F6FB0" stroke-width="1.8" marker-end="url(#m-azul)"/><path d="M765,325 V397 H800" fill="none" stroke="#2F6FB0" stroke-width="1.8" marker-end="url(#m-azul)"/><path d="M565,380 V497 H776" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="6 4"/><text x="786" y="502" class="eb" text-anchor="middle" fill="#C0392B">✕</text><text x="575" y="490" class="s" text-anchor="start">local distinto: no pasa</text><rect x="40" y="575" width="700" height="100" rx="14" fill="#F7F7F8" stroke="#C7CAD1" stroke-width="1.5"/><text x="54" y="597" class="grupo" fill="#C7CAD1">LEYENDA</text><path d="M60,619 H110" fill="none" stroke="#2E8B57" stroke-width="1.8" marker-end="url(#m-verde)"/><text x="120" y="623" class="e" text-anchor="start">copia del aviso «documento rechazado»</text><path d="M60,645 H110" fill="none" stroke="#2F6FB0" stroke-width="1.8" marker-end="url(#m-azul)"/><text x="120" y="649" class="e" text-anchor="start">copia del aviso «comanda en conflicto»</text><path d="M400,619 H450" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="6 4"/><text x="460" y="623" class="e" text-anchor="start">la regla no coincide: no se entrega</text><rect x="800" y="575" width="570" height="100" rx="9" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.6"/><text x="1085.0" y="614.0" class="t" font-size="14" text-anchor="middle">Administración → Mensajería (dueño o admin)</text><text x="1085.0" y="632.0" class="s" text-anchor="middle">crea y elimina estos destinos y sus reglas; valida antes de aplicar</text><text x="1085.0" y="648.0" class="s" text-anchor="middle">los destinos de tipo cola se revisan con «Ver mensajes»</text></svg>