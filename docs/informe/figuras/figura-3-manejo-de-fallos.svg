<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1110" width="1400" height="1110" role="img" aria-label="Figura 3. Secuencia de un mensaje fallido: qué hace cada componente y dónde se decide"><title>Figura 3. Secuencia de un mensaje fallido: qué hace cada componente y dónde se decide</title><defs><marker id="m-peticion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="i-peticion" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="m-identidad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B5FBF"/></marker><marker id="i-identidad" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B5FBF"/></marker><marker id="m-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9822B"/></marker><marker id="i-async" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9822B"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker><marker id="i-ok" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker><marker id="m-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="i-no" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="m-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FB0"/></marker><marker id="i-azul" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FB0"/></marker><marker id="m-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker><marker id="i-verde" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker><marker id="m-manual" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="i-manual" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><style>text{font-family:Segoe UI, Arial, Helvetica, sans-serif;} .t{font-weight:600;fill:#1F2937;} .s{font-size:12.5px;fill:#4B5563;} .grupo{font-size:13px;font-weight:700;letter-spacing:.06em;} .e{font-size:12.5px;fill:#374151;} .eb{font-size:12.5px;fill:#374151;font-weight:600;} .lbl{font-size:12.5px;fill:#1F2937;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round;}</style></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="20" y="20" width="1360" height="70" rx="14" fill="#F7F7F8" stroke="#C7CAD1" stroke-width="1.5"/><text x="34" y="42" class="grupo" fill="#C7CAD1">EJEMPLO</text><text x="118" y="39" class="e" text-anchor="start">El proveedor de documentos tributarios no responde y una boleta no se puede emitir. Cada columna es un componente;</text><text x="118" y="57" class="e" text-anchor="start">cada fila numerada, una interacción en orden. Los rombos ◆ marcan dónde se toma una decisión (detalle abajo).</text><rect x="25" y="100" width="150" height="56" rx="9" fill="#FFFFFF" stroke="#C2812A" stroke-width="1.6"/><text x="100.0" y="125.0" class="t" font-size="12" text-anchor="middle">procesador-eventos</text><text x="100.0" y="143.0" class="s" text-anchor="middle">Lambda</text><path d="M100,156 V950" stroke="#B8BCC4" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="195" y="100" width="150" height="56" rx="9" fill="#FFF1DC" stroke="#C2812A" stroke-width="1.6"/><text x="270.0" y="125.0" class="t" font-size="12" text-anchor="middle">dte-emision</text><text x="270.0" y="143.0" class="s" text-anchor="middle">cola SQS</text><path d="M270,156 V950" stroke="#B8BCC4" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="365" y="100" width="150" height="56" rx="9" fill="#FFFFFF" stroke="#C2812A" stroke-width="1.6"/><text x="440.0" y="125.0" class="t" font-size="12" text-anchor="middle">emision-dte</text><text x="440.0" y="143.0" class="s" text-anchor="middle">Lambda</text><path d="M440,156 V950" stroke="#B8BCC4" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="535" y="100" width="150" height="56" rx="9" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.6"/><text x="610.0" y="125.0" class="t" font-size="12" text-anchor="middle">Proveedor de DTE</text><text x="610.0" y="143.0" class="s" text-anchor="middle">simulado</text><path d="M610,156 V950" stroke="#B8BCC4" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="705" y="100" width="150" height="56" rx="9" fill="#FCE4C4" stroke="#C2812A" stroke-width="1.6"/><text x="780.0" y="125.0" class="t" font-size="12" text-anchor="middle">DynamoDB</text><text x="780.0" y="143.0" class="s" text-anchor="middle">operacion</text><path d="M780,156 V950" stroke="#B8BCC4" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="875" y="100" width="150" height="56" rx="9" fill="#FFF1DC" stroke="#C2812A" stroke-width="1.6"/><text x="950.0" y="125.0" class="t" font-size="12" text-anchor="middle">dte-emision-fallidos</text><text x="950.0" y="143.0" class="s" text-anchor="middle">cola SQS</text><path d="M950,156 V950" stroke="#B8BCC4" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="1045" y="100" width="150" height="56" rx="9" fill="#FFF8E1" stroke="#C9A227" stroke-width="1.6"/><text x="1120.0" y="125.0" class="t" font-size="12" text-anchor="middle">CloudWatch + SNS</text><text x="1120.0" y="143.0" class="s" text-anchor="middle">alarma y alertas</text><path d="M1120,156 V950" stroke="#B8BCC4" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="1215" y="100" width="150" height="56" rx="9" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.6"/><text x="1290.0" y="125.0" class="t" font-size="12" text-anchor="middle">Mensajería</text><text x="1290.0" y="143.0" class="s" text-anchor="middle">PWA + función</text><path d="M1290,156 V950" stroke="#B8BCC4" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="20" y="168" width="1360" height="400" rx="8" fill="#FFF8EF" fill-opacity="0.55" stroke="#EBC48A" stroke-width="1"/><text x="30" y="184" class="grupo" text-anchor="start" fill="#C2812A">1 · LA MÁQUINA REINTENTA SOLA</text><rect x="20" y="576" width="1360" height="128" rx="8" fill="#FFF8EF" fill-opacity="0.55" stroke="#EBC48A" stroke-width="1"/><text x="30" y="592" class="grupo" text-anchor="start" fill="#C2812A">2 · SE APARTA Y SE AVISA</text><rect x="20" y="712" width="1360" height="238" rx="8" fill="#FFF8EF" fill-opacity="0.55" stroke="#EBC48A" stroke-width="1"/><text x="30" y="728" class="grupo" text-anchor="start" fill="#C2812A">3 · UNA PERSONA DECIDE, SOLO PORQUE LA MÁQUINA NO PUDO</text><path d="M100,205 H270" fill="none" stroke="#D9822B" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#m-async)"/><text x="108" y="199" class="lbl">1. venta cerrada: emitir boleta</text><path d="M270,245 H440" fill="none" stroke="#D9822B" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#m-async)"/><text x="278" y="239" class="lbl">2. entrega el mensaje (recepción 1)</text><path d="M440,285 H610" fill="none" stroke="#D9822B" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#m-async)"/><text x="448" y="279" class="lbl">3. emitir boleta</text><path d="M610,320 H440" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#m-no)"/><text x="448" y="314" class="lbl">no responde (error 5xx)</text><path d="M424,311 L433,320 L424,329 L415,320 z" fill="#C9A227"/><text x="424" y="324" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text><path d="M440,360 H780" fill="none" stroke="#D9822B" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#m-async)"/><text x="448" y="354" class="lbl">4. registra el error y el intento (diagnóstico)</text><path d="M440,400 H270" fill="none" stroke="#D9822B" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#m-async)"/><text x="278" y="394" class="lbl">5. lo devuelve: visible otra vez en ~30 s</text><path d="M254,391 L263,400 L254,409 L245,400 z" fill="#C9A227"/><text x="254" y="404" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text><rect x="250" y="420" width="420" height="58" rx="6" fill="#FFFFFF" fill-opacity="0.85" stroke="#C9A227" stroke-dasharray="4 3"/><text x="262" y="440" class="e" text-anchor="start">se repite (pasos 2 a 5) en las recepciones 2, 3 y 4,</text><text x="262" y="458" class="e" text-anchor="start">con esperas de ~1, ~2 y ~4 minutos entre una y otra</text><path d="M270,508 H440" fill="none" stroke="#D9822B" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#m-async)"/><text x="278" y="502" class="lbl">6. recepción 5: falla otra vez</text><path d="M440,548 H780" fill="none" stroke="#D9822B" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#m-async)"/><text x="448" y="542" class="lbl">7. estado «fallido» + evento «documento fallido»</text><path d="M270,612 H950" fill="none" stroke="#D9822B" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#m-async)"/><text x="278" y="606" class="lbl">8. superó 5 recepciones: SQS lo mueve a la cola de fallidos (redrive)</text><path d="M270,603 L279,612 L270,621 L261,612 z" fill="#C9A227"/><text x="270" y="616" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text><path d="M950,652 H1120" fill="none" stroke="#D9822B" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#m-async)"/><text x="958" y="646" class="lbl">9. alarma: hay un fallido</text><text x="1158" y="688" class="s" text-anchor="start">correo al equipo técnico</text><path d="M1290,750 H950" fill="none" stroke="#D9822B" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#m-async)"/><text x="958" y="744" class="lbl">10. lee el mensaje apartado</text><path d="M1290,790 H780" fill="none" stroke="#D9822B" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#m-async)"/><text x="788" y="784" class="lbl">11. lee su diagnóstico: intento 5, error 5xx</text><path d="M1290,821 L1299,830 L1290,839 L1281,830 z" fill="#C9A227"/><text x="1290" y="834" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text><text x="1290" y="860" class="s" text-anchor="end">proveedor de vuelta:</text><text x="1290" y="876" class="eb" text-anchor="end">Reprocesar</text><path d="M1290,900 H270" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#m-manual)"/><text x="278" y="894" class="lbl">12. Reprocesar: lo reenvía a su cola y lo borra de fallidos</text><path d="M270,932 H440" fill="none" stroke="#2E8B57" stroke-width="1.8" marker-end="url(#m-verde)"/><text x="278" y="926" class="lbl">13. entrega</text><path d="M440,932 H780" fill="none" stroke="#2E8B57" stroke-width="1.8" marker-end="url(#m-verde)"/><text x="448" y="926" class="lbl">14. emitida con el mismo folio</text><path d="M440,941 L449,950 L440,959 L431,950 z" fill="#C9A227"/><text x="440" y="954" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">D</text><rect x="20" y="968" width="1360" height="130" rx="14" fill="#F7F7F8" stroke="#C7CAD1" stroke-width="1.5"/><text x="34" y="990" class="grupo" fill="#C7CAD1">DECISIONES</text><path d="M46,995 L55,1004 L46,1013 L37,1004 z" fill="#C9A227"/><text x="46" y="1008" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text><text x="64" y="1008" class="e" text-anchor="start">emision-dte: ¿el proveedor respondió? No respondió → es recuperable: no se marca final y se reintenta. (Si hubiera respondido «rechazado», sería definitivo: sin reintentos y con aviso al dueño.)</text><path d="M46,1017 L55,1026 L46,1035 L37,1026 z" fill="#C9A227"/><text x="46" y="1030" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text><text x="64" y="1030" class="e" text-anchor="start">SQS: ¿superó las 5 recepciones? No → el mensaje vuelve tras la espera. Sí → pasa solo a la cola de fallidos.</text><path d="M46,1039 L55,1048 L46,1057 L37,1048 z" fill="#C9A227"/><text x="46" y="1052" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text><text x="64" y="1052" class="e" text-anchor="start">Persona: ¿se arregló la causa? Sí → Reprocesar. Si la venta no corresponde → Descartar (se borra).</text><path d="M46,1061 L55,1070 L46,1079 L37,1070 z" fill="#C9A227"/><text x="46" y="1074" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">D</text><text x="64" y="1074" class="e" text-anchor="start">emision-dte: el folio ya estaba asignado → se reutiliza; reprocesar nunca crea una segunda boleta.</text></svg>